# colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# base indexes to 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-window-option -g automatic-rename on

# source config file
bind r source-file ~/.config/tmux/tmux.conf

# prefix key rebind
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# misc
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"
set -s escape-time 0
set -g history-limit 2000

# ledge popups (prefix f overrides tmux's default find-window)
bind f display-popup -E -B -w 70% -h 65% "ledge project pick"
bind s display-popup -E -B -w 70% -h 65% "ledge ss tree"
bind S choose-tree -Zs
bind b display-popup -E -B -w 70% -h 65% "ledge bm tree --session-scope"
bind B display-popup -E -B -w 70% -h 65% "ledge bm tree"
bind e display-popup -E -B -w 70% -h 65% "ledge bm edit --session-scope"
# prefix g: open a ledge session in the home folder for commands outside any project
bind g run-shell -b "ledge $HOME --no-profile"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'Nybkox/tmux-ukiyo'
source-file -q ~/.config/tmux/theme-active.conf
set -g @ukiyo-ignore-window-colors true

set -g @ukiyo-plugins "cwd ram-usage git"
set -g @ukiyo-show-powerline false
set -g @ukiyo-clients-minimum 1
set -g @ukiyo-cwd-max-dirs "0"
set -g @ukiyo-cwd-max-chars "0"
set -g @ukiyo-ignore-window-colors true

# Initialize TPM (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
source-file -q ~/.config/tmux/theme-active.conf
run-shell ~/.config/tmux/transparent.sh
